name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  detection-gate:
    # Builds the warehouse with its 8 planted incidents and fails unless every one is detected
    # and false alerts stay under 0.1 per table per week.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Evaluate against planted incidents
        run: |
          uv run --python 3.12 datawatch eval --gate --max-false-per-table-week 0.1 \
            --db data/warehouse.duckdb --markdown evaluation.md
          cat evaluation.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t data-watch:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name dw -p 8855:8855 -e DATAWATCH_SCALE=0.3 data-watch:ci
          for i in $(seq 1 90); do curl -sf localhost:8855/healthz && break; sleep 2; done
          curl -sf localhost:8855/healthz | grep -q '"ok"'
          curl -sf localhost:8855/api/incidents | grep -q INC-108-raw_order_items
          curl -sf localhost:8855/metrics | grep datawatch_detection_rate
          curl -sf -X POST localhost:8855/api/incidents/INC-108-raw_order_items/actions \
            -H 'content-type: application/json' -d '{"action": "acknowledge"}' | grep -q acknowledged
          docker exec dw ls -la /app/data
          docker logs dw | head -5
          docker rm -f dw
